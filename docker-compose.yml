
services:
  postgres:
    image: postgres:17
    container_name: contactbook-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-contactbook}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-contactbook}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
